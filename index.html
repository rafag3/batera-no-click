<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#110F17">
<title>Batera no Click — treino diário de bateria</title>
<meta name="description" content="Metrônomo, os 40 rudimentos e um treino diário que avalia seu timing pelo microfone. Grátis, direto no navegador.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://batera-no-click.vercel.app/">
<meta property="og:site_name" content="Batera no Click">
<meta property="og:title" content="Batera no Click — treino diário de bateria">
<meta property="og:description" content="Metrônomo, os 40 rudimentos e um treino diário que avalia seu timing pelo microfone. Grátis, direto no navegador.">
<meta property="og:image" content="https://batera-no-click.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <div class="logo">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="26" fill="#252131" stroke="#FF8A2B" stroke-width="3"/>
      <line x1="18" y1="46" x2="44" y2="20" stroke="#FF8A2B" stroke-width="4" stroke-linecap="round"/>
      <circle cx="45.5" cy="18.5" r="3" fill="#FF8A2B"/>
      <line x1="46" y1="46" x2="20" y2="20" stroke="#3EB8F0" stroke-width="4" stroke-linecap="round"/>
      <circle cx="18.5" cy="18.5" r="3" fill="#3EB8F0"/>
    </svg>
    <div class="wordmark">BATERA<br><span>NO CLICK</span></div>
  </div>
  <button class="streak-chip" id="streakChip" aria-label="Sequência de dias">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.3 3 2.5 3 0-3-1-5.5 0-8z"/></svg>
    <span id="streakNum">0 dias</span>
  </button>
</header>

<main>
  <section id="v-intro" class="view" aria-label="Conheça o app"></section>
  <section id="v-hoje" class="view on" aria-label="Hoje"></section>
  <section id="v-feedback" class="view" aria-label="Enviar feedback"></section>
  <section id="v-trilha" class="view" aria-label="Trilha"></section>
  <section id="v-rud" class="view" aria-label="Rudimentos"></section>

  <section id="v-metro" class="view" aria-label="Metrônomo">
   <div class="metro-cols"><div>
    <div class="card bpm-box">
      <div class="bpm-num" id="bpmNum">120</div>
      <div class="muted small">BPM · arraste o número pro lado</div>
      <div class="bpm-adjust">
        <button data-d="-5">−5</button><button data-d="-1">−1</button>
        <button data-d="1">+1</button><button data-d="5">+5</button>
      </div>
      <div class="pads" id="pads"></div>
    </div>
    <div class="row2">
      <button class="btn-primary" id="btnStart">Tocar</button>
      <button class="btn-ghost" id="btnTap">Tap tempo</button>
    </div>
    <p class="muted small desk-only" style="margin-top:10px;text-align:center">Atalhos: <kbd>espaço</kbd> toca e para, <kbd>T</kbd> marca o tap tempo</p>
   </div><div>
    <div class="ctrl-grid">
      <label class="ctrl">Compasso
        <select id="selSig">
          <option value="2">2/4</option><option value="3">3/4</option><option value="4" selected>4/4</option>
          <option value="5">5/4</option><option value="6">6/8</option><option value="7">7/8</option>
        </select>
      </label>
      <label class="ctrl">Subdivisão
        <select id="selSub">
          <option value="1" selected>Semínima</option><option value="2">Colcheia</option>
          <option value="3">Tercina</option><option value="4">Semicolcheia</option>
        </select>
      </label>
      <label class="ctrl">Som
        <select id="selSound"><option value="wood" selected>Madeira</option><option value="beep">Beep</option><option value="rim">Aro</option></select>
      </label>
      <div class="ctrl">
        <label for="rngVol">Volume</label>
        <input type="range" id="rngVol" min="0" max="100" value="80">
        <button class="btn-mini" id="btnTest">Testar som</button>
      </div>
      <label class="ctrl check wide"><input type="checkbox" id="chkAccent" checked> Acentuar o tempo 1</label>
    </div>

    <details class="card panel">
      <summary>Speed trainer</summary>
      <div class="panel-body">
        <div class="grid3">
          <label>Início<input type="number" id="stFrom" value="80" min="20" max="300"></label>
          <label>Final<input type="number" id="stTo" value="120" min="20" max="300"></label>
          <label>+BPM<input type="number" id="stInc" value="5" min="1" max="40"></label>
        </div>
        <label>A cada quantos compassos<input type="number" id="stEvery" value="4" min="1" max="64"></label>
        <label class="check"><input type="checkbox" id="stOn"> Ativar speed trainer</label>
        <p class="live" id="stLive" hidden></p>
      </div>
    </details>

    <details class="card panel">
      <summary>BPM de uma música</summary>
      <div class="panel-body">
        <label class="file-btn" for="fileAudio">Escolher arquivo de áudio</label>
        <input type="file" id="fileAudio" accept="audio/*" hidden>
        <p class="muted small" id="bpmDetStatus"></p>
        <div id="bpmDetResult" hidden>
          <div class="big-num" id="bpmDetValue">—</div>
          <p class="muted small" id="bpmDetAlt"></p>
          <button class="btn-primary" id="btnUseBpm">Usar esse BPM</button>
        </div>
        <p class="muted small">A análise roda no aparelho, nada é enviado. Funciona melhor com batida marcada; confira com o tap tempo.</p>
      </div>
    </details>
   </div></div>
  </section>

  <section id="v-perfil" class="view" aria-label="Perfil"></section>
</main>

<nav class="tabbar" aria-label="Navegação">
  <button data-view="hoje" class="on">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoje</button>
  <button data-view="trilha">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>Trilha</button>
  <button data-view="rud">
    <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="15" rx="9" ry="4"/><path d="M3 15v-3c0-2.2 4-4 9-4s9 1.8 9 4v3"/><path d="M6 3l5 7M18 3l-5 7"/></svg>Rudimentos</button>
  <button data-view="metro">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l4 18H5z"/><path d="M12 15l5-8"/></svg>Metrônomo</button>
  <button data-view="perfil">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
</nav>

<div id="session" class="overlay" hidden>
  <div class="s-top">
    <button class="icon-btn" id="sClose" aria-label="Fechar treino">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="s-dots" id="sDots"></div>
    <span class="muted small" id="sStep"></span>
  </div>
  <div class="s-body" id="sBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Vercel Web Analytics: contagem anônima de visitas, sem cookies -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
